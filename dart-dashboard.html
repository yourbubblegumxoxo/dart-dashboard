<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dart">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#151a22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Dart Dashboard</title>
<style>
:root{--bg:#0b0e13;--panel:#151a22;--panel2:#1e2530;--line:#2c3543;--text:#eef1f5;--mute:#93a0b2;--acc:#22c55e;--accink:#04130a;--red:#f87171;--gold:#fbbf24;--tap:52px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 8px 0 0;letter-spacing:.3px;white-space:nowrap}
header h1 span{color:var(--acc)}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{background:none;border:0;padding:0 16px;min-height:44px;border-radius:10px;color:var(--mute);cursor:pointer;font-weight:600;white-space:nowrap}
nav button.on{background:var(--panel2);color:var(--text)}
main{padding:12px;max-width:1200px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:12px;margin:18px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 18px;min-height:var(--tap);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{filter:brightness(1.3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.dan{color:var(--red)}
.btn.big{min-height:60px;padding:0 26px;font-size:18px}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 18px;min-height:var(--tap);cursor:pointer;font-weight:600}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.seg.sm button{min-height:44px;padding:0 14px;font-size:14px}
input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:var(--tap);min-width:0}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:0 18px 0 10px;min-height:var(--tap);cursor:pointer;font-weight:600}
.chip.on{border-color:var(--c)}
.chip i{width:30px;height:30px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;font-style:normal;font-size:14px;color:#000;font-weight:800}
.chip:not(.on) i{opacity:.45}
.mute{color:var(--mute)}
.small{font-size:13px}

/* ---------- Spiel ---------- */
.game{display:flex;flex-direction:column;gap:8px}
.side{display:contents}
.info{order:1;font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.info b{color:var(--text)}
.pcards{order:2;display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
.pcards.n1{grid-template-columns:1fr}
.pcards.many{grid-template-columns:repeat(4,1fr)}
.pc{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px;position:relative;overflow:hidden;min-width:0}
.pc:not(.act){opacity:.7}
.pc.act{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
.pc.out{opacity:.35}
.pc .nm{font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:64px}
.pc .nm b{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pc .sc{font-size:clamp(34px,7vw,66px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.pc .meta{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.pc .meta b{color:var(--text)}
.pc .legs{position:absolute;top:7px;right:10px;font-size:11px;color:var(--mute);text-align:right;line-height:1.3}
.pc .legs b{color:var(--gold);font-size:14px}
.many .pc{padding:6px 8px}
.many .pc .sc{font-size:30px}
.many .pc .meta .x{display:none}
.many .pc .nm{padding-right:0}
.many .pc .legs{position:static;text-align:left}
.cm{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:4px 0;font-size:11px;text-align:center}
.cm div{background:var(--panel2);border-radius:5px;padding:2px 0}
.cm div.cl{background:color-mix(in srgb,var(--acc) 30%,var(--panel2))}
.cm span{display:block;font-weight:800;font-size:14px;height:17px}
.turn{order:3;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.slots{display:grid;grid-template-columns:repeat(3,1fr) 1.1fr;gap:6px}
.slot{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:6px 4px;text-align:center;min-height:62px;cursor:default;display:flex;flex-direction:column;justify-content:center}
button.slot{cursor:pointer}
.slot .l{font-weight:800;font-size:22px;line-height:1.1}
.slot .v{font-size:12px;color:var(--mute)}
.slot.sum{background:none;border:1px dashed var(--line)}
.slot.next{border-color:var(--acc)}
.slot.edit{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--panel2))}
.slot.edit .v{color:var(--gold)}
.hint{margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);font-weight:700;text-align:center;min-height:40px;display:flex;flex-direction:column;justify-content:center}
.hint.none{background:none;color:var(--mute);font-weight:400}
.hint small{display:block;font-weight:400;color:var(--mute)}
.confirm{margin-top:8px;display:grid;gap:6px}
.confirm .btn{width:100%;min-height:68px;font-size:20px;flex-direction:column;gap:0;line-height:1.2}
.confirm .btn small{font-weight:500;font-size:13px;opacity:.8}
.confirm .btn.bust{background:var(--red);border-color:var(--red);color:#210404}
.confirm p{margin:0;text-align:center;font-size:13px;color:var(--mute)}
.boardwrap{order:4;display:grid;place-items:center;position:relative}
svg.board{width:min(100%,calc(100dvh - 570px));min-width:min(100%,320px);height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;display:block}
svg.board.live .f{cursor:pointer}
svg.board.live .f:active{filter:brightness(1.8)}
.boardwrap.dim svg{opacity:.3;pointer-events:none}
.boardwrap .lock{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:18px;padding:20px;pointer-events:none}
.ctl{order:5;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctl .btn{min-height:60px;font-size:17px}
.ctl2{order:6;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn.off{color:var(--mute);text-decoration:line-through}
.pc .tm{display:flex;gap:2px 12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:2px}
.pc .tm .on{color:var(--text);font-weight:700}
.pc .tm .on::before{content:'▶ ';color:var(--c)}
tr.click{cursor:pointer}
.banner{border-color:var(--gold)}
.badges{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.bd{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bd i{font-style:normal;font-size:26px;flex:none;width:34px;text-align:center}
.bd b{display:block;font-size:14px}
.bd small{color:var(--mute);font-size:12px;line-height:1.3;display:block}
.bd.got{border-color:var(--gold)}
.bd:not(.got){opacity:.45}
.bd:not(.got) i{filter:grayscale(1)}
.news{text-align:left;background:var(--panel2);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14px}
.news b{color:var(--gold)}
.news div{margin-top:4px}
.dlg>.btn{width:100%;min-height:60px;font-size:17px}
.dlg h3{text-align:center}
/* ---------- Lexikon ---------- */
.demo{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:18px;align-items:center}
.demo svg{width:100%;height:auto;display:block}
.demo .dbig{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.demo .dcap{font-size:17px;line-height:1.45;min-height:5.8em;margin:10px 0}
.demo .dots{display:flex;gap:5px;margin-bottom:12px}
.demo .dots i{flex:1;max-width:28px;height:5px;border-radius:3px;background:var(--line)}
.demo .dots i.on{background:var(--acc)}
@media(max-width:640px){.demo{grid-template-columns:1fr}}
.lex p{line-height:1.5;margin:0 0 10px}
.lex ul{margin:0 0 10px;padding-left:20px;line-height:1.5}
dl.gl{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
dl.gl div{background:var(--panel2);border-radius:12px;padding:10px 12px}
dl.gl dt{font-weight:700}
dl.gl dd{margin:2px 0 0;color:var(--mute);font-size:14px;line-height:1.4}
@media (min-width:820px) and (orientation:landscape){
  main.g{padding:8px 10px;max-width:none}
  .game{display:grid;grid-template-columns:minmax(300px,1fr) auto;gap:10px;height:calc(100dvh - 74px);min-height:420px}
  .side{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
  .pcards{flex:1;overflow:auto;align-content:start;min-height:0;padding:3px}
  .pcards.many{grid-template-columns:repeat(2,1fr)}
  .boardwrap{height:100%;aspect-ratio:1;max-width:60vw;min-height:0}
  svg.board{width:100%;height:100%;min-width:0}
  .pc .sc{font-size:clamp(34px,5vw,64px)}
}
/* ---------- Spieler / Statistik ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid2>.card{margin:0}
.st{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.st div{background:var(--panel2);border-radius:12px;padding:10px 12px;min-width:0}
.st small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.st b{font-size:20px;font-variant-numeric:tabular-nums}
.st em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph .av{width:42px;height:42px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:800;color:#000;flex:none}
.ph h2{margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=color]{width:44px;height:44px;border:0;background:none;padding:0;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-size:12px;text-transform:uppercase;font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mute);font-size:12px}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--acc);stroke:var(--panel);stroke-width:2}
.chart .hit{fill:transparent}
.chart .avg{stroke:var(--mute);stroke-width:1;stroke-dasharray:4 4}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.bars .bar{height:18px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0;min-width:2px}
.bars .bar i.z{min-width:0}
.bars span:last-child{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.heat{display:grid;place-items:center}
.heat svg{width:min(100%,380px);height:auto}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,#1e2530,#fbbf24)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:grid;place-items:center;z-index:20;padding:16px;overflow:auto}
.ov .card{max-width:560px;width:100%;text-align:center}
.ov .trophy{font-size:54px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:12px 18px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;font-weight:600;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#tip{position:fixed;background:#000;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:13px;pointer-events:none;z-index:40;display:none;white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>🎯 Dart<span>Dashboard</span></h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<div id="tip"></div>
<script>
'use strict';
/* ================= Daten ================= */
const LS='dartdash.db.v1', LSG='dartdash.game.v2', MAXP=8;
const COLORS=['#22c55e','#3b82f6','#f59e0b','#ef4444','#a855f7','#14b8a6','#ec4899','#eab308'];
let storageOk=true;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){storageOk=false;return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){storageOk=false}}
let db=lsGet(LS)||{};
db.players=db.players||[];db.matches=db.matches||[];
db.setup=Object.assign({mode:'x01',start:501,in:'straight',out:'single',legs:1,sets:1,teams:false,bull:false,rounds:7,sel:[]},db.setup||{});
db.cfg=Object.assign({voice:true,sound:true,wake:true},db.cfg||{});
if(db.sinceBackup==null)db.sinceBackup=db.matches.length;
let G=lsGet(LSG), hist=[], view='play', editIdx=null, curP=null, curM=null, rng=0;
if(G){G.news=G.news||[];G.pb=G.pb||{};G.badges=G.badges||{};G.left=G.left||[]}
let dlg=null,subOut=null,subIn=null;
db.setup.bot=db.setup.bot||0;
const save=()=>lsSet(LS,db), saveG=()=>lsSet(LSG,G);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const num=(x,d=1)=>isFinite(x)?x.toFixed(d).replace('.',','):'–';
const pct=(a,b)=>b?Math.round(a/b*100)+' %':'–';
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms)}
const lab=t=>!t.m?(t.o?'Aus '+t.o:'Miss'):t.s==25?(t.m==2?'Bull':'25'):'SDT'[t.m-1]+t.s;
const MODES={x01:'X01',cricket:'Cricket',atc:'Around the Clock',shanghai:'Shanghai',bob:"Bob's 27",train:'Training'};
const OUTS={single:'Single Out',double:'Double Out',master:'Master Out'};
function modeLabel(m){
  const o=m.opts||{};
  if(m.mode=='x01')return o.start+' · '+(o.in=='double'?'Double In · ':'')+OUTS[o.out]+((o.sets||1)>1?' · First to '+o.sets+' Sets ('+o.legs+' Legs)':o.legs>1?' · First to '+o.legs+' Legs':'')+(o.teams?' · Teams':'');
  if(m.mode=='cricket')return 'Cricket'+(o.teams?' · Teams':'');
  if(m.mode=='shanghai')return 'Shanghai · '+(o.rounds||7)+' Runden';
  return MODES[m.mode];
}
const SCORING=m=>m=='x01'||m=='train';          // Modi mit 3-Dart-Average
const POINTS=m=>m=='shanghai'||m=='bob'||m=='cricket';
const isWin=(m,p)=>!p.left&&m.winner!=null&&(m.winner==p.id||(p.team!=null&&p.team===m.wt));
/* Seite = Platz in der Wurfreihenfolge (bzw. Team): bleibt beim Auswechseln gleich, damit der Rest weiterläuft */
const sideKey=p=>p.team!=null?'t'+p.team:p.slot!=null?'s'+p.slot:p.id;

/* ================= Ton, Ansage, Bildschirm wach halten ================= */
let AC=null,wl=null,wlBusy=false;
function tone(f,t0,d,type,g){
  const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime+t0;
  o.type=type;o.frequency.value=f;a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(a);a.connect(AC.destination);o.start(t);o.stop(t+d);
}
function fx(k){
  if(!db.cfg.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
    if(k=='tick')tone(880,0,.05,'square',.04);
    if(k=='miss')tone(220,0,.09,'square',.04);
    if(k=='bust')tone(170,0,.4,'sawtooth',.1);
    if(k=='max')[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.28,'triangle',.16));
    if(k=='win')[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.13,.32,'triangle',.16));
  }catch(e){}
}
function say(t,fresh){
  if(!db.cfg.voice||typeof speechSynthesis=='undefined')return;
  try{if(fresh)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}
}
async function wake(){
  const want=!!(db.cfg.wake&&G&&!G.done);
  if(wlBusy||typeof navigator=='undefined'||!navigator.wakeLock)return;
  try{
    if(want&&!wl&&document.visibilityState=='visible'){wlBusy=true;const l=await navigator.wakeLock.request('screen');wl=l;l.addEventListener('release',()=>{if(wl===l)wl=null})}
    else if(!want&&wl){const l=wl;wl=null;l.release()}
  }catch(e){}
  wlBusy=false;
}

/* ================= Checkout-Rechner ================= */
const ALL=[];for(let n=20;n>=1;n--)for(let m=3;m>=1;m--)ALL.push({s:n,m});ALL.push({s:25,m:1},{s:25,m:2});
const BYVAL={};ALL.forEach(t=>{(BYVAL[t.s*t.m]=BYVAL[t.s*t.m]||[]).push(t)});
const DPREF=[20,16,18,12,10,8,14,4,6,2,19,17,15,13,11,9,7,5,3,1];
function setupCost(t){
  if(t.s==25)return t.m==2?3.5:2.5;
  if(t.m==1)return 1+(20-t.s)*.01;
  if(t.m==3)return 2+Math.min(20-t.s,6)*.1;
  return 3+(20-t.s)*.01;
}
function finalCost(t,out){
  if(out=='single'){
    if(t.s==25)return t.m==2?2:.5;
    return t.m==1?(20-t.s)*.01:t.m==2?1.5:2;
  }
  if(t.m==2)return t.s==25?2.2:DPREF.indexOf(t.s)*.1;
  if(t.m==3&&out=='master')return 1.5+(20-t.s)*.05;
  return Infinity;
}
function checkout(rest,n,out){
  if(rest<1||rest>180)return null;
  const fin=v=>{let b=null,bc=Infinity;for(const t of BYVAL[v]||[]){const c=finalCost(t,out);if(c<bc){bc=c;b=t}}return b?{t:b,c:bc}:null};
  let f=fin(rest);if(f)return [f.t];
  if(n<2)return null;
  let best=null,bc=Infinity;
  for(const a of ALL){const f=fin(rest-a.s*a.m);if(f){const c=setupCost(a)+f.c;if(c<bc){bc=c;best=[a,f.t]}}}
  if(best)return best;
  if(n<3)return null;
  for(let i=0;i<ALL.length;i++){const a=ALL[i],ca=setupCost(a),ra=rest-a.s*a.m;if(ra<1)continue;
    for(let j=i;j<ALL.length;j++){const b=ALL[j];const f=fin(ra-b.s*b.m);if(f){const c=ca+setupCost(b)+f.c;if(c<bc){bc=c;best=[a,b,f.t]}}}}
  return best;
}
const coMemo={};
const canFinish=(r,out)=>{const k=r+out;return k in coMemo?coMemo[k]:(coMemo[k]=!!checkout(r,3,out))};

/* ================= Spiel-Logik ================= */
const CR=[20,19,18,17,16,15,25];
const bobT=()=>G.round<=20?G.round:25;
function newGame(){
  const s=db.setup, sel=s.sel.filter(id=>db.players.some(p=>p.id==id));
  if(!sel.length){toast('Bitte mindestens einen Spieler wählen');return}
  const list=sel.map(id=>db.players.find(p=>p.id==id)).map(p=>({id:p.id,name:p.name,color:p.color})),lv=s.mode=='train'?0:s.bot;
  if(lv)list.push({id:'bot'+lv,name:'Computer ('+BOT[lv].n+')',color:'#94a3b8',bot:lv});
  const tm=!!s.teams&&(s.mode=='x01'||s.mode=='cricket');
  if(tm&&(list.length<4||list.length%2)){toast('Für Teams bitte 4, 6 oder 8 Spieler wählen (der Computer zählt mit)');return}
  const opts=s.mode=='x01'?{start:s.start,in:s.in,out:s.out,legs:s.legs,sets:s.sets,teams:tm}:s.mode=='cricket'?{teams:tm}:s.mode=='atc'?{bull:s.bull}:s.mode=='shanghai'?{rounds:s.rounds}:{};
  G={v:2,id:uid(),t0:Date.now(),mode:s.mode,opts,cur:0,starter:0,leg:1,set:1,round:1,turn:[],turns:[],legs:[],pending:null,done:false,winner:null,snap:null,
     news:[],badges:{},pb:{},left:[],
     players:list.map((p,i)=>({id:p.id,name:p.name,color:p.color,bot:p.bot||0,team:tm?i%2:null,legs:0,sets:0,lw:0,sum:0,tDarts:0,best:0,last:null,out:false}))};
  // Ausgangswerte für „neue Bestleistung“ und neue Auszeichnungen
  for(const p of G.players)if(!p.bot)G.pb[p.id]=pbBase(p.id);
  resetLeg();hist=[];editIdx=null;dlg=null;saveG();render();
}
function pbBase(id){
  const t=stats(id);return{g:t.games,best:t.best,co:t.co,short:t.short[G.opts.start]||0,avg:t.bestAvg,bob:t.bob,sh:t.sh,bd:badgeIds(t)};
}
function resetLeg(){
  for(const p of G.players){
    p.legDarts=0;p.last=null;
    if(G.mode=='x01'){p.score=G.opts.start;p.in=G.opts.in!='double'}
    if(G.mode=='train'||G.mode=='shanghai')p.score=0;
    if(G.mode=='bob')p.score=27;
    if(G.mode=='cricket'){p.pts=0;p.marks={};CR.forEach(n=>p.marks[n]=0)}
    if(G.mode=='atc')p.target=1;
  }
  G.cur=G.starter;markTurn();
}
/* Beginn einer Aufnahme: Zustand merken, damit einzelne Darts korrigiert werden können */
function markTurn(){
  const p=G.players[G.cur];G.ts=G.mode=='cricket'?p.pts:(p.score||0);
  G.pending=null;G.snap=null;G.snap=JSON.stringify(G);
}
function applyDart(t){
  const p=G.players[G.cur],v=t.s*t.m;let bust=false,win=false;
  G.turn.push(t);p.legDarts++;
  const full=G.turn.length==3;
  if(G.mode=='x01'){
    if(!p.in&&t.m==2)p.in=true;
    if(p.in){
      const r=p.score-v,o=G.opts.out;
      if(r<0||(o!='single'&&r==1)||(r==0&&o=='double'&&t.m!=2)||(r==0&&o=='master'&&t.m<2))bust=true;
      else{p.score=r;win=r==0}
    }
  }else if(G.mode=='train'){p.score+=v}
  else if(G.mode=='cricket'){
    if(t.m&&t.s>=15){for(let h=0;h<t.m;h++){if(p.marks[t.s]<3)p.marks[t.s]++;else if(G.players.some(o=>o!==p&&o.marks[t.s]<3))p.pts+=t.s}}
    win=CR.every(n=>p.marks[n]>=3)&&G.players.every(o=>o===p||o.pts<=p.pts);
  }else if(G.mode=='atc'){
    if(t.m&&t.s==p.target){if(p.target==25||(p.target==20&&!G.opts.bull))win=true;else p.target=p.target==20?25:p.target+1}
  }else if(G.mode=='shanghai'){
    const n=G.round;
    if(t.m&&t.s==n){p.score+=v;win=new Set(G.turn.filter(d=>d.m&&d.s==n).map(d=>d.m)).size==3}
  }else if(G.mode=='bob'){
    const n=bobT(),hit=d=>d.m==2&&d.s==n;
    if(hit(t))p.score+=2*n;
    if(full&&!G.turn.some(hit)){p.score-=2*n;if(p.score<=0)p.out=true}
  }
  if(bust)p.score=G.ts;
  for(const q of mates(p))if(q!==p){   // Team teilt sich den Stand
    if(G.mode=='x01'){q.score=p.score;q.in=p.in}
    if(G.mode=='cricket'){q.pts=p.pts;q.marks=Object.assign({},p.marks)}
  }
  if(win||bust||full)G.pending={bust,win};
}
const mates=p=>p.team==null?[p]:G.players.filter(q=>q.team===p.team);
function replay(darts){
  const snap=G.snap;G=JSON.parse(snap);G.snap=snap;
  for(const t of darts){if(G.pending)break;applyDart(t)}
}
function pushHist(){hist.push(JSON.stringify(G));if(hist.length>80)hist.shift()}
function throwDart(t,fromBot){
  if(!G||G.done)return;
  if(G.players[G.cur].bot&&!fromBot){toast('Der Computer wirft gerade');return}
  if(editIdx!=null&&editIdx<G.turn.length){
    pushHist();const d=G.turn.slice();d[editIdx]=t;replay(d);editIdx=null;
  }else{
    if(G.pending){toast('Erst bestätigen – oder einen Dart antippen, um ihn zu ändern');return}
    pushHist();applyDart(t);
  }
  fx(t.m?'tick':'miss');
  saveG();render();
}
function confirmTurn(fromBot){
  if(!G||G.done||!G.pending)return;
  if(G.players[G.cur].bot&&fromBot!==1)return;
  const p=G.players[G.cur],pd=G.pending,sc=turnScore(p,pd.bust),n0=G.news.length;
  pushHist();editIdx=null;endTurn(pd.bust,pd.win);saveG();render();
  // Neue persönliche Bestleistung?
  const nw=G.news.slice(n0),sn=q=>q.bot?'Computer':q.name;
  if(nw.length){toast('⭐ Neue Bestleistung! '+nw.join(' · '),7000);fx('max')}
  const pbSay=()=>{if(nw.length)say('Neue persönliche Bestleistung')};
  // Ansage und Töne
  if(G.done){
    const w=G.players.find(q=>q.id==G.winner),ws=w?mates(w):[];
    fx('win');say(w?'Game shot! '+ws.map(sn).join(' und ')+(ws.length>1?' gewinnen':' gewinnt'):'Spiel beendet',1);
    pbSay();return;
  }
  // Danach: wer ist dran – mit Rest, sobald ein Finish möglich ist
  // Der Name wird nur ab drei Spielern genannt – zu zweit ist klar, wer dran ist
  const n=G.players[G.cur],cnt=G.players.length;
  const next=()=>{
    if(G.mode=='x01'&&n.in&&n.score<=170&&canFinish(n.score,G.opts.out))say((cnt>2?sn(n)+', ':'')+n.score+' Rest');
    else if(cnt>2)say(sn(n));
  };
  if(pd.win){fx('win');say('Game shot! Leg für '+(p.team!=null?'Team '+'AB'[p.team]:sn(p)),1);pbSay();if(cnt>1)say(sn(n)+' beginnt')}
  else if(pd.bust){fx('bust');say('Überworfen',1);next()}
  else{
    if(sc==180)fx('max');
    if(G.mode!='atc')say(String(sc),1);else if(typeof speechSynthesis!='undefined')speechSynthesis.cancel();
    pbSay();next();
  }
}
/* Bestleistungen während des Spiels – erst ab 3 früheren Spielen, sonst wäre anfangs alles ein Rekord */
function pbCheck(p,sc,win){
  const b=G.pb[p.id];if(p.bot||!b||b.g<3)return;
  if(SCORING(G.mode)&&b.best>0&&sc>b.best){G.news.push(p.name+': höchste Aufnahme '+sc+' (bisher '+b.best+')');b.best=sc}
  if(win&&G.mode=='x01'){
    if(b.co>0&&sc>b.co){G.news.push(p.name+': höchstes Finish '+sc+' (bisher '+b.co+')');b.co=sc}
    if(p.team==null&&p.subLeg!=G.leg&&b.short&&p.legDarts<b.short){G.news.push(p.name+': kürzestes Leg mit '+p.legDarts+' Darts (bisher '+b.short+')');b.short=p.legDarts}
  }
}

/* ================= Computergegner ================= */
/* sd = Streuung in mm auf einer echten Scheibe; avg = ungefährer 3-Dart-Average bei 501 Double Out */
const BOT=[null,{n:'Anfänger',sd:30,avg:30},{n:'Leicht',sd:20,avg:40},{n:'Mittel',sd:16.5,avg:50},{n:'Stark',sd:14,avg:60},{n:'Sehr stark',sd:10.5,avg:75},{n:'Profi',sd:7.8,avg:90}];
let botT=null;
function gauss(){let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())}
function botAim(p){
  const m=G.mode,tr=n=>n==25?{s:25,m:2}:{s:n,m:3};
  if(m=='x01'){
    if(!p.in)return{s:20,m:2};
    const co=checkout(p.score,3-G.turn.length,G.opts.out)||checkout(p.score,3,G.opts.out);
    return co?co[0]:{s:20,m:3};
  }
  if(m=='cricket'){
    const open=CR.filter(n=>p.marks[n]<3);if(open.length)return tr(open[0]);
    const n=CR.find(n=>G.players.some(o=>o!==p&&o.marks[n]<3));return tr(n||25);
  }
  if(m=='atc')return{s:p.target,m:p.target==25?2:1};
  if(m=='shanghai')return{s:G.round,m:3};
  if(m=='bob')return{s:bobT(),m:2};
  return{s:20,m:3};
}
/* Wurf simulieren: Zielpunkt auf echter Scheibengeometrie plus zufällige Streuung */
const REAL=[0,6.35,15.9,99,107,162,170,230],SHOWN=[0,16,34,90,120,150,182,208];
function botHit(aim,sd){
  const a=aim.s==25?0:ORD.indexOf(aim.s)*18*Math.PI/180,r0=aim.s==25?0:aim.m==3?103:aim.m==2?166:134;
  const x=r0*Math.sin(a)+gauss()*sd,y=-r0*Math.cos(a)+gauss()*sd,r=Math.hypot(x,y);
  let i=1;while(i<7&&r>REAL[i])i++;
  const rd=Math.min(206,SHOWN[i-1]+(SHOWN[i]-SHOWN[i-1])*(r-REAL[i-1])/(REAL[i]-REAL[i-1])),k=r?rd/r:0;
  const t={x:+(x*k).toFixed(1),y:+(y*k).toFixed(1)};
  const sct=ORD[Math.floor(((Math.atan2(x,-y)*180/Math.PI+369)%360)/18)];
  if(r<=6.35){t.s=25;t.m=2}else if(r<=15.9){t.s=25;t.m=1}else if(r>170){t.s=0;t.m=0;if(r<=225)t.o=sct}
  else{t.s=sct;t.m=r>=162?2:r>=99&&r<=107?3:1}
  return t;
}
function botTick(){
  if(botT||dlg||!G||G.done||!G.players[G.cur].bot)return;
  botT=setTimeout(()=>{
    botT=null;if(!G||G.done||dlg)return;const p=G.players[G.cur];if(!p.bot)return;
    if(G.pending)confirmTurn(1);else throwDart(botHit(botAim(p),BOT[p.bot].sd),1);
  },G.pending?1600:G.turn.length?850:1300);
}
function turnScore(p,bust){
  return bust?0:G.mode=='x01'?G.ts-p.score:G.mode=='cricket'?p.pts-G.ts:G.mode=='atc'?0:p.score-G.ts;
}
function endTurn(bust,win){
  const p=G.players[G.cur],sc=turnScore(p,bust);
  G.turns.push({p:p.id,leg:G.leg,d:G.turn.map(t=>t.o?[0,0,t.o]:[t.s,t.m]),sc,bust:bust?1:0});   // [0,0,n] = ins Aus beim Feld n
  p.last={d:G.turn.map(lab),sc,bust};p.sum+=sc;p.tDarts+=G.turn.length;if(sc>p.best)p.best=sc;
  G.turn=[];G.pending=null;
  pbCheck(p,sc,win);
  if(win){
    if(G.mode!='x01'){finish(p.id);return}
    const ms=mates(p),who=p.team!=null?'Team '+'AB'[p.team]:p.name;
    ms.forEach(q=>{q.legs++;q.lw++});G.legs.push({w:p.id,darts:ms.reduce((a,q)=>a+q.legDarts,0),co:sc,t:p.team,mx:ms.some(q=>q.subLeg==G.leg)?1:undefined});
    if(p.legs>=G.opts.legs){
      ms.forEach(q=>q.sets++);
      if(p.sets>=(G.opts.sets||1)){finish(p.id);return}
      toast('Set '+G.set+' geht an '+who);G.set++;G.players.forEach(q=>q.legs=0);
    }else toast('Leg geht an '+who);
    G.leg++;G.starter=(G.starter+1)%G.players.length;resetLeg();return;
  }
  advance();
}
function advance(){
  const n=G.players.length,rb=G.mode=='shanghai'||G.mode=='bob';
  if(G.players.every(q=>q.out)){finishTop();return}
  let i=G.cur,rolled=false;
  do{i=(i+1)%n;if(i==0&&rb){G.round++;rolled=true}}while(G.players[i].out);
  G.cur=i;
  if(rolled){
    const max=G.mode=='bob'?21:G.opts.rounds;
    if(G.round>max){
      const mx=Math.max(...G.players.map(q=>q.score)),tie=G.players.filter(q=>q.score==mx).length>1;
      if(G.mode=='bob'||!tie||G.round>20){finishTop();return}
      toast('Gleichstand – Verlängerung auf die '+G.round);
    }
  }
  markTurn();
}
function finishTop(){
  const b=G.players.reduce((a,q)=>q.score>a.score?q:a);
  finish(G.mode=='bob'&&b.score<=0?null:b.id);
}
function finish(wid,unf){
  G.done=true;G.winner=wid;G.unf=unf?1:0;dlg=null;
  const wp=G.players.find(p=>p.id==wid);
  db.sinceBackup=(db.sinceBackup||0)+1;
  db.matches.push({id:G.id,date:G.t0,mode:G.mode,opts:G.opts,
    players:G.players.map((p,i)=>({id:p.id,name:p.name,team:p.team,slot:i,from:p.subLeg,bot:p.bot||undefined,res:G.mode=='cricket'?p.pts:G.mode=='atc'?null:p.score,sets:p.sets,lw:p.lw}))
      .concat(G.left.map(p=>({id:p.id,name:p.name,team:p.team,slot:p.slot,left:1,res:null}))),
    winner:wid,wt:wp?wp.team:null,unf:unf?1:undefined,turns:G.turns,legs:G.legs,dur:Math.round((Date.now()-G.t0)/1000)});
  // Bestleistungen und neue Auszeichnungen am Spielende
  for(const p of G.players.concat(G.left)){
    const b=G.pb[p.id];if(p.bot||!b)continue;
    if(b.g>=3){
      if(G.mode=='x01'&&p.tDarts>=9){const a=p.sum/p.tDarts*3;if(b.avg>0&&a>b.avg)G.news.push(p.name+': bester Spiel-Average '+num(a)+' (bisher '+num(b.avg)+')')}
      if(G.mode=='bob'||G.mode=='shanghai'){const o=G.mode=='bob'?b.bob:b.sh;if(o!=null&&p.score>o)G.news.push(p.name+': '+MODES[G.mode]+'-Bestwert '+p.score+' (bisher '+o+')')}
    }
    const nb=badgeIds(stats(p.id)).filter(k=>!b.bd.includes(k));if(nb.length)G.badges[p.id]=nb;
  }
  save();
}
/* Spiel vorzeitig beenden: angefangene Aufnahme zählt mit, das Spiel wird mit oder ohne Sieger gespeichert */
function endEarly(wid){
  if(!G||G.done)return;
  pushHist();
  if(G.turn.length){
    const p=G.players[G.cur],bust=!!(G.pending&&G.pending.bust),sc=bust?0:turnScore(p,false);
    G.turns.push({p:p.id,leg:G.leg,d:G.turn.map(t=>t.o?[0,0,t.o]:[t.s,t.m]),sc,bust:bust?1:0});
    p.sum+=sc;p.tDarts+=G.turn.length;if(sc>p.best)p.best=sc;G.turn=[];G.pending=null;
  }
  if(!G.turns.length){G=null;hist=[];dlg=null;saveG();render();toast('Es wurde noch nichts geworfen – nichts gespeichert');return}
  finish(wid||null,1);saveG();render();
  if(wid)fx('win');
}
/* Spieler auswechseln: Platz, Punktestand und Team bleiben, ab jetzt zählen die Würfe für die neue Person */
function substitute(){
  const slot=G.players.findIndex(p=>p.id==subOut);
  if(slot<0||!subIn){toast('Bitte beide Personen auswählen');return}
  const np=db.players.find(p=>p.id==subIn);if(!np)return;
  pushHist();
  const p=G.players[slot],old={id:p.id,name:p.name,color:p.color,team:p.team,slot};
  G.left=G.left.filter(q=>q.id!=np.id);
  if(G.turns.some(t=>t.p==p.id))G.left.push(old);
  Object.assign(p,{id:np.id,name:np.name,color:np.color,sum:0,tDarts:0,best:0,last:null,subLeg:G.leg});
  if(!G.pb[np.id])G.pb[np.id]=pbBase(np.id);
  const s=db.setup.sel,i=s.indexOf(old.id);if(i>=0&&!s.includes(np.id))s[i]=np.id;save();
  dlg=null;subOut=subIn=null;markTurn();saveG();render();
  toast(np.name+' übernimmt für '+old.name);say(np.name+' übernimmt für '+old.name,1);
}
function undo(){
  if(!hist.length){toast('Nichts zum Rückgängigmachen');return}
  const id=G.id;G=JSON.parse(hist.pop());editIdx=null;dlg=null;
  if(botT){clearTimeout(botT);botT=null}
  while(hist.length&&!G.done&&G.players[G.cur].bot)G=JSON.parse(hist.pop());   // Würfe des Computers überspringen
  const n=db.matches.length;db.matches=db.matches.filter(m=>m.id!=id);if(db.matches.length!=n){db.sinceBackup=Math.max(0,db.sinceBackup-1);save()}
  saveG();render();
}
function endTraining(){
  if(G.turn.length)endTurn(false,false);
  if(G.done){}else if(G.turns.length)finish(null);else G=null;
  saveG();render();
}

/* ================= Dartscheibe ================= */
/* Bewusst nicht maßstabsgetreu: Triple, Double und Bull sind für Finger vergrößert */
const ORD=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const RINGS=[[34,90,1],[90,120,3],[120,150,1],[150,182,2]], RB=16, RO=34;
const pt=(r,a)=>(r*Math.sin(a)).toFixed(2)+' '+(-r*Math.cos(a)).toFixed(2);
const sec=(r1,r2,a1,a2)=>`M${pt(r1,a1)}L${pt(r2,a1)}A${r2} ${r2} 0 0 1 ${pt(r2,a2)}L${pt(r1,a2)}A${r1} ${r1} 0 0 0 ${pt(r1,a1)}Z`;
function heatCol(c,max){
  if(!c)return '#1e2530';
  const t=.15+.85*Math.sqrt(c/max),a=[30,37,48],b=[251,191,36];
  return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
}
function boardSVG(o={}){
  const {hl,heat,live,marks=[]}=o,max=heat?Math.max(1,...Object.values(heat)):0;
  const hc=(n,m)=>heatCol(heat[n+'_'+m]||0,max), tip=(n,m)=>heat?` data-tip="${lab({s:n,m})}: ${heat[n+'_'+m]||0}×"`:'';
  let h=`<svg class="board${live?' live':''}" viewBox="-212 -212 424 424"${live?' id="board"':''}><circle r="212" fill="#06080b" data-s="0" data-m="0"/><circle r="184" fill="#111" data-s="0" data-m="0"/>`,top='';
  ORD.forEach((n,i)=>{
    const a1=(i*18-9)*Math.PI/180,a2=(i*18+9)*Math.PI/180;
    // Außenring: Dart ins Aus bei diesem Feld
    h+=`<path class="f" d="${sec(182,212,a1,a2)}" fill="${heat?hc('o',n):'#06080b'}" stroke="${heat?'#0b0e13':'#06080b'}" stroke-width="${heat?1.5:.6}" data-s="0" data-m="0" data-o="${n}"${heat?` data-tip="Aus bei ${n}: ${heat['o_'+n]||0}×"`:''}/>`;
    for(const[r1,r2,m]of RINGS){
      const fill=heat?hc(n,m):m==1?(i%2?'#e9dfc3':'#1b1b1b'):(i%2?'#15803d':'#c62828'),d=sec(r1,r2,a1,a2);
      h+=`<path class="f" d="${d}" fill="${fill}" stroke="${heat?'#0b0e13':'#555'}" stroke-width="${heat?1.5:.6}" data-s="${n}" data-m="${m}"${tip(n,m)}/>`;
      if(hl&&hl(n,m))top+=`<path d="${d}" fill="rgba(251,191,36,.35)" stroke="#fbbf24" stroke-width="3" pointer-events="none"/>`;
    }
    const a=i*18*Math.PI/180;
    h+=`<text x="${(197*Math.sin(a)).toFixed(1)}" y="${(-197*Math.cos(a)+6.5).toFixed(1)}" fill="#ddd" stroke="#06080b" stroke-width="3" paint-order="stroke" font-size="19" font-weight="700" text-anchor="middle" pointer-events="none">${n}</text>`;
  });

const DIST=[['0–39',0,39],['40–59',40,59],['60–79',60,79],['80–99',80,99],['100–139',100,139],['140–179',140,179],['180',180,180]];
function stats(pid,days=0){
  const since=days?Date.now()-days*864e5:0;
  const s={games:0,mg:0,wins:0,pts:0,darts:0,best:0,freq:{},c180:0,c140:0,c100:0,co:0,short:{},hits:{},seg:{},miss:0,all:0,f9p:0,f9d:0,fast:null,modes:{},
    trend:[],dist:DIST.map(()=>0),nTurns:0,coTry:0,coHit:0,legsP:0,legsW:0,wDarts:0,h2h:{},bob:null,sh:null,busts:0,dbl:{},dTry:0,dHit:0,streak:0,bestAvg:0,wl:0,coBull:0,shInst:0,botMax:0,outs:{},outN:0};
  let cs=0;
  for(const m of db.matches){
    if(m.date<since||!m.players.some(p=>p.id==pid))continue;
    const me=m.players.find(p=>p.id==pid),won=isWin(m,me),multi=m.players.filter(p=>!p.left).length>1&&!me.left&&!(m.unf&&m.winner==null);
    s.games++;s.modes[m.mode]=(s.modes[m.mode]||0)+1;
    if(multi){
      s.mg++;if(won){s.wins++;if(++cs>s.streak)s.streak=cs}else cs=0;
      for(const o of m.players)if(o.id!=pid&&!o.left&&(me.team==null||o.team!==me.team)){const h=s.h2h[o.id]=s.h2h[o.id]||{name:o.name,g:0,w:0,l:0};h.name=o.name;h.g++;if(won)h.w++;else if(isWin(m,o))h.l++}
    }
    if(won&&m.dur&&(!s.fast||m.dur<s.fast.dur))s.fast={dur:m.dur,l:m.mode=='x01'?m.opts.start:MODES[m.mode]};
    if(m.mode=='bob'&&me.res!=null&&(s.bob==null||me.res>s.bob))s.bob=me.res;
    if(m.mode=='shanghai'&&me.res!=null&&(s.sh==null||me.res>s.sh))s.sh=me.res;
    if(won)for(const o of m.players)if(o.bot>s.botMax)s.botMax=o.bot;
    const cnt={},rest={},inn={},side={},sc=SCORING(m.mode),x=m.mode=='x01';let mp=0,md=0,lastT=null;
    m.players.forEach(p=>side[p.id]=sideKey(p));const myLegs=new Set();
    for(const t of m.turns){
      // Rest wird je Seite (Spieler oder Team) mitgeführt
      const k=t.leg+'|'+side[t.p];let r=0;
      if(x){r=rest[k]??m.opts.start;rest[k]=r-t.sc}
      if(t.p!=pid){if(x&&t.d.some(d=>d[1]==2))inn[k]=1;continue}
      lastT=t;myLegs.add(t.leg);
      if(x&&!t.bust&&t.sc>0&&r-t.sc==0){const l=t.d[t.d.length-1];if(l[0]==25&&l[1]==2)s.coBull++}
      for(const[n,mu,o]of t.d){s.all++;if(!mu){s.miss++;if(o){s.outs[o]=(s.outs[o]||0)+1;s.outN++}}else{const k=lab({s:n,m:mu});s.hits[k]=(s.hits[k]||0)+1;s.seg[n+'_'+mu]=(s.seg[n+'_'+mu]||0)+1}}
      if(!sc)continue;
      s.pts+=t.sc;s.darts+=t.d.length;mp+=t.sc;md+=t.d.length;if(t.sc>s.best)s.best=t.sc;
      if(!t.bust&&t.d.length==3)s.freq[t.sc]=(s.freq[t.sc]||0)+1;
      if(t.sc==180)s.c180++;else if(t.sc>=140)s.c140++;else if(t.sc>=100)s.c100++;
      s.nTurns++;s.dist[DIST.findIndex(d=>t.sc<=d[2])]++;
      if(m.mode=='x01'){
        cnt[t.leg]=(cnt[t.leg]||0)+1;if(cnt[t.leg]<=3){s.f9p+=t.sc;s.f9d+=t.d.length}
        if(r<=170&&canFinish(r,m.opts.out))s.coTry++;
        if(t.bust)s.busts++;
        // Darts aufs Doppel: Rest ist direkt mit einem Doppel (oder Bull) zu checken
        let rr=r,isIn=m.opts.in!='double'||!!inn[k];
        for(const[n,mu]of t.d){
          if(!isIn){if(mu==2)isIn=true;else continue}
          const f=m.opts.out=='single'?0:rr==50?25:rr<=40&&rr%2==0?rr/2:0;
          if(f){const e=s.dbl[f]=s.dbl[f]||[0,0];e[0]++;s.dTry++;if(n==f&&mu==2){e[1]++;s.dHit++}}
          rr-=n*mu;if(rr<2)break;
        }
        if(isIn)inn[k]=1;
      }
    }
    if(m.mode=='shanghai'&&won&&lastT&&lastT.d.length==3&&new Set(lastT.d.map(d=>d[0])).size==1&&new Set(lastT.d.map(d=>d[1])).size==3&&lastT.d.every(d=>d[1]))s.shInst++;
    if(m.mode=='x01'){
      if(md){s.trend.push({d:m.date,v:mp/md*3,l:m.opts.start});if(md>=9&&mp/md*3>s.bestAvg)s.bestAvg=mp/md*3}
      (m.legs||[]).forEach((l,li)=>{
        // Legs zählen, in denen die Person dabei war (wichtig bei Auswechslungen)
        const L=li+1;if(me.left?L>Math.max(0,...myLegs):me.from?L<me.from:false)return;
        s.legsP++;const mine=l.w==pid;
        if(mine||(me.team!=null&&l.t===me.team))s.legsW++;
        if(mine){s.coHit++;if(l.co>s.co)s.co=l.co;
          if(me.team==null&&!l.mx){s.wDarts+=l.darts;s.wl++;const k=m.opts.start;if(!s.short[k]||l.darts<s.short[k])s.short[k]=l.darts}}
      });
    }
  }
  s.avg=s.darts?s.pts/s.darts*3:NaN;s.f9=s.f9d?s.f9p/s.f9d*3:NaN;
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  s.topFreq=top(s.freq)[0];s.topHits=top(s.hits).slice(0,5);
  s.shortTxt=Object.entries(s.short).map(([k,v])=>v+' Darts ('+k+')').join(', ');
  return s;
}

function trendSVG(tr){

  const x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo)),mean=vs.reduce((a,b)=>a+b,0)/n,bw=(W-L-R)/(n-1);

function vRecords(){
  const all=db.players.map(p=>({p,s:stats(p.id)})).filter(a=>a.s.games);
  if(!all.length)return '<div class="card"><h2>Rekorde</h2><p class="mute" style="margin:0">Noch keine Spiele gespielt.</p></div>';
  const R=[];
  const rec=(l,f,fmt=v=>v,low)=>{
    const c=all.map(a=>({n:a.p.name,v:f(a.s)})).filter(c=>c.v!=null&&isFinite(c.v)&&c.v>0).sort((a,b)=>low?a.v-b.v:b.v-a.v);
    if(!c.length)return;
    const top=c.filter(e=>e.v==c[0].v),nx=c[top.length];
    R.push(`<tr><td>${l}</td><td><b>${top.map(e=>esc(e.n)).join(', ')}</b></td><td class="n"><b>${fmt(c[0].v)}</b></td><td class="mute">${nx?esc(nx.n)+' · '+fmt(nx.v):'–'}</td></tr>`);
  };
  rec('Bester Average (gesamt)',s=>s.avg,v=>num(v));
  rec('Bester Average in einem Spiel',s=>s.bestAvg,v=>num(v));
  rec('Höchstes Finish',s=>s.co);
  rec('Höchste Aufnahme',s=>s.best);
  rec('Meiste 180er',s=>s.c180);
  rec('Beste Doppelquote (ab 10 Versuchen)',s=>s.dTry>=10?s.dHit/s.dTry*100:null,v=>num(v,0)+' %');
  for(const k of [...new Set(all.flatMap(a=>Object.keys(a.s.short)))].sort((a,b)=>a-b))rec('Kürzestes Leg ('+k+')',s=>s.short[k],v=>v+' Darts',1);

  rec('Shanghai Bestwert',s=>s.sh);
  return rankHTML(all)+'<div class="card"><h2>Rekorde</h2>'+(R.length?'<div style="overflow-x:auto"><table><tr><th>Rekord</th><th>Halter</th><th class="n">Wert</th><th>Platz 2</th></tr>'+R.join('')+'</table></div><p class="mute small" style="margin:8px 0 0">Kürzestes Leg und Siegesserie zählen ohne Team-Spiele bzw. nur Mehrspieler-Spiele.</p>':'<p class="mute" style="margin:0">Noch keine Rekorde.</p>')+'</div>';

function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();

}

}
function importFile(mode){
  const f=$('#imp').files[0];if(!f){toast('Bitte zuerst eine Datei wählen');return}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!Array.isArray(d.players)||!Array.isArray(d.matches))throw 0;
      if(mode=='replace'){if(!confirm('Wirklich alle aktuellen Daten durch das Backup ersetzen?'))return;db.players=d.players;db.matches=d.matches}
      else{
        for(const p of d.players)if(!db.players.some(q=>q.id==p.id))db.players.push(p);
        for(const m of d.matches)if(!db.matches.some(q=>q.id==m.id))db.matches.push(m);
        db.matches.sort((a,b)=>a.date-b.date);
      }
      save();render();toast('Import abgeschlossen');
    }catch(e){toast('Datei konnte nicht gelesen werden')}
  };
  r.readAsText(f);
}

/* ================= Aktionen ================= */
function addPlayer(){
  const i=$('#np'),name=i.value.trim();if(!name){i.focus();return}
  const p={id:uid(),name,color:COLORS[db.players.length%COLORS.length]};db.players.push(p);
  if(db.setup.sel.length<MAXP)db.setup.sel.push(p.id);save();render();
}
const acts={
  nav:e=>{view=e.dataset.v;render();scrollTo(0,0)},
  set:e=>{db.setup[e.dataset.k]=JSON.parse(e.dataset.v);save();render()},
  sel:e=>{const s=db.setup.sel,i=s.indexOf(e.dataset.id);if(i>=0)s.splice(i,1);else if(s.length<MAXP)s.push(e.dataset.id);else toast('Maximal '+MAXP+' Spieler');save();render()},
  addp:addPlayer,
  start:newGame,
  miss:()=>throwDart({s:0,m:0}),
  edit:e=>{const i=+e.dataset.i;if(!G||G.done||i>=G.turn.length||G.players[G.cur].bot)return;editIdx=editIdx===i?null:i;render()},
  confirm:()=>confirmTurn(),
  undo:undo,
  endtrain:endTraining,
  abort:()=>{if(confirm('Spiel wirklich verwerfen? Die Würfe werden nicht gespeichert.')){G=null;hist=[];editIdx=null;dlg=null;saveG();render()}},
  dlg:e=>{dlg=e.dataset.v||null;render()},
  endsave:()=>endEarly(null),
  endwin:e=>{const p=G.players.find(q=>q.id==e.dataset.id);if(p&&confirm('Spiel beenden und als Sieg für '+(G.opts.teams?'Team '+'AB'[p.team]:p.name)+' werten?'))endEarly(p.id)},
  subopen:()=>{if(G.turn.length||G.pending){toast('Bitte erst die laufende Aufnahme beenden bzw. bestätigen');return}const c=G.players[G.cur];subOut=c.bot?null:c.id;subIn=null;dlg='sub';render()},
  subout:e=>{subOut=e.dataset.id;render()},
  subin:e=>{subIn=e.dataset.id;render()},
  subadd:()=>{const i=$('#subnew'),name=i.value.trim();if(!name){i.focus();return}const p={id:uid(),name,color:COLORS[db.players.length%COLORS.length]};db.players.push(p);save();subIn=p.id;render()},
  subdo:()=>substitute(),
  menu:()=>{G=null;hist=[];dlg=null;saveG();render()},
  rematch:()=>{const s=db.setup.sel;if(s.length>1)s.push(s.shift());save();newGame()},
  player:e=>{curP=e.dataset.id;view='player';render();scrollTo(0,0)},
  match:e=>{curM=e.dataset.id;view='match';render();scrollTo(0,0)},
  tog:e=>{const k=e.dataset.k;db.cfg[k]=!db.cfg[k];save();
    if(k=='voice'){if(db.cfg.voice)say('Ansage an',1);else if(typeof speechSynthesis!='undefined')speechSynthesis.cancel()}
    if(k=='sound'&&db.cfg.sound)fx('tick');
    render()},
  later:()=>{db.sinceBackup=5;save();render()},
  lexm:e=>{lexMode=e.dataset.v;lexStep=0;lexPlay=true;render()},
  lexring:e=>{lexRing=e.dataset.v;render()},
  lexplay:()=>{lexPlay=!lexPlay;render()},
  lexgo:e=>{const n=DEMOS[lexMode].steps.length;lexStep=(lexStep+ +e.dataset.v+n)%n;lexPlay=false;render()},
  rng:e=>{rng=+e.dataset.v;render()},
  full:()=>{const d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>toast('Vollbild wird hier nicht unterstützt'));else toast('Vollbild wird hier nicht unterstützt')},
  ren:e=>{const p=db.players.find(p=>p.id==e.dataset.id),n=prompt('Neuer Name',p.name);if(n&&n.trim()){p.name=n.trim().slice(0,20);save();render()}},
  delp:e=>{const p=db.players.find(p=>p.id==e.dataset.id);if(confirm('Spieler „'+p.name+'“ löschen? Gespielte Spiele bleiben im Verlauf.')){db.players=db.players.filter(q=>q!==p);db.setup.sel=db.setup.sel.filter(id=>id!=p.id);save();render()}},
  delm:e=>{if(confirm('Dieses Spiel aus Verlauf und Statistik löschen?')){db.matches=db.matches.filter(m=>m.id!=e.dataset.id);save();render()}},
  exjson:()=>{download('dart-backup-'+stamp()+'.json',JSON.stringify({app:'DartDashboard',version:2,exported:new Date().toISOString(),players:db.players,matches:db.matches},null,1),'application/json');
    db.sinceBackup=0;db.lastBackup=Date.now();save();render();toast('Backup gespeichert – Datei liegt im Download-Ordner')},
  excsv:e=>exportCSV(e.dataset.v),
  imp:e=>importFile(e.dataset.v),
  wipe:()=>{if(confirm('Wirklich ALLE Spieler und Spiele löschen?')&&confirm('Sicher? Das lässt sich nicht rückgängig machen.')){db.players=[];db.matches=[];db.setup.sel=[];db.sinceBackup=0;G=null;save();saveG();render()}}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('#board');
  if(b){
    const t=e.target;if(t.dataset.s===undefined||!G||G.done)return;
    const pt=b.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(b.getScreenCTM().inverse());
    throwDart({s:+t.dataset.s,m:+t.dataset.m,o:t.dataset.o?+t.dataset.o:undefined,x:+q.x.toFixed(1),y:+q.y.toFixed(1)});return;
  }
  const a=e.target.closest('[data-act]');if(a&&acts[a.dataset.act])acts[a.dataset.act](a);
});
document.addEventListener('change',e=>{
  if(e.target.type=='color'){const p=db.players.find(p=>p.id==e.target.dataset.id);if(p){p.color=e.target.value;save();render()}}
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='np')addPlayer();if(e.key=='Enter'&&e.target.id=='subnew')acts.subadd()});
document.addEventListener('visibilitychange',wake);
/* Online gehostet: Offline-Modus einschalten und den Browser bitten, die Daten nicht automatisch zu löschen */
if(typeof location!='undefined'&&location.protocol=='https:'){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
/* Tooltip für Diagramme (Maus und Finger) */
const tipEl=$('#tip');
function showTip(e){
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){tipEl.style.display='none';return}
  tipEl.textContent=t.dataset.tip;tipEl.style.display='block';
  const w=tipEl.offsetWidth;tipEl.style.left=Math.max(6,Math.min(innerWidth-w-6,e.clientX-w/2))+'px';tipEl.style.top=Math.max(6,e.clientY-44)+'px';
}
document.addEventListener('pointermove',showTip);document.addEventListener('pointerdown',showTip);
render();
</script>
